name: native-ci
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: terraphim-native
    steps:
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace
      # Include all targets after the 2026-07-31 regression (terraphim/terraphim-agents#91).
      - run: cargo test --workspace --all-targets --no-fail-fast
